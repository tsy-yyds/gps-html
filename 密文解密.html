<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解密</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        h1 {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            padding: 14px;
            font-size: 14px;
            font-family: monospace;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: rgba(255,255,255,0.25); }
        textarea::placeholder { color: rgba(255,255,255,0.2); }
        .btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.16); }
        .result {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .result .label {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 4px;
        }
        .result .value {
            font-size: 20px;
            font-weight: 600;
            font-family: monospace;
            color: #00cec9;
            word-break: break-all;
        }
        .result .coord {
            display: flex;
            gap: 16px;
            margin-top: 12px;
        }
        .result .coord > div { flex: 1; }
        #map {
            width: 100%;
            height: 280px;
            border-radius: 10px;
            margin-top: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
        }
        #map iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .error {
            color: #e84393;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>解密 · 定位</h1>
        <textarea id="input" placeholder="粘贴 Base64 密文"></textarea>
        <button class="btn" onclick="decrypt()">解密并定位</button>
        <div id="error"></div>
        <div id="result" style="display:none;"></div>
        <div id="map" style="display:none;"></div>
    </div>

    <script>
    function decrypt() {
        var input = document.getElementById('input').value.trim();
        var errEl = document.getElementById('error');
        var resEl = document.getElementById('result');
        var mapEl = document.getElementById('map');
        errEl.textContent = '';
        resEl.style.display = 'none';
        mapEl.style.display = 'none';

        if (!input) {
            errEl.textContent = '请先粘贴密文';
            return;
        }

        var raw;
        try {
            raw = decodeURIComponent(escape(atob(input)));
        } catch(e) {
            errEl.textContent = '解码失败，请检查密文是否正确';
            return;
        }

        var parts = raw.split(',');
        if (parts.length < 2) {
            errEl.textContent = '格式不正确，解码结果: ' + raw;
            return;
        }

        var lat = parseFloat(parts[0]);
        var lon = parseFloat(parts[1]);
        if (isNaN(lat) || isNaN(lon)) {
            errEl.textContent = '经纬度解析失败';
            return;
        }

        resEl.innerHTML =
            '<div class="label">解密结果</div>' +
            '<div class="value">' + raw + '</div>' +
            '<div class="coord">' +
                '<div><div class="label">纬度</div><div class="value" style="font-size:16px;">' + lat.toFixed(6) + '</div></div>' +
                '<div><div class="label">经度</div><div class="value" style="font-size:16px;">' + lon.toFixed(6) + '</div></div>' +
            '</div>';
        resEl.style.display = 'block';

        mapEl.innerHTML = '<iframe src="https://uri.amap.com/marker?position=' + lon + ',' + lat + '"></iframe>';
        mapEl.style.display = 'block';
    }

    document.getElementById('input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            decrypt();
        }
    });
    </script>
</body>
</html>
