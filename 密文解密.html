<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解密</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0D0D'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23A6885B' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='3.5' fill='%23C7A473'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preconnect" href="https://sf3-scmcdn-cn.feishucdn.com" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* ===== TECY 功能页主题 · 密文解密 ===== */
:root{
  --paper:#0A0D0D;
  --card:#0E1213;
  --ink:#E6E1D8;
  --dim:#9BA2A0;
  --muted:#6C7674;
  --brass:#A6885B;
  --brass-hi:#C7A473;
  --line:rgba(230,225,216,.12);
  --line-soft:rgba(230,225,216,.07);
  --wall:#C4806A;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(166,136,91,.11) 0%, rgba(166,136,91,0) 62%) no-repeat,
    var(--paper);
  min-height:100vh;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.7;
}
.container{
  max-width:540px;
  margin:0 auto;
  padding:52px 24px 64px;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.mark{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.24em;
  color:rgba(230,225,216,.34);
  margin-bottom:26px;
  display:block;
}
h1{
  font-family:var(--serif);
  font-size:22px;
  font-weight:700;
  letter-spacing:.03em;
  line-height:1.5;
  margin-bottom:6px;
}
.tagline{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  color:#8A928F;
  margin-bottom:26px;
}
textarea{
  width:100%;
  height:92px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:2px;
  color:var(--ink);
  padding:15px 16px;
  font-size:16px;
  font-family:var(--mono);
  line-height:1.7;
  resize:none;
  outline:none;
  transition:border-color .3s var(--ease);
}
textarea:focus{border-color:rgba(166,136,91,.62)}
textarea::placeholder{color:#5C6562}
.btn{
  display:block;
  width:100%;
  margin-top:14px;
  padding:14px;
  background:var(--brass);
  border:1px solid var(--brass);
  border-radius:2px;
  color:#0A0D0D;
  font-size:14px;
  font-weight:500;
  letter-spacing:.05em;
  font-family:inherit;
  cursor:pointer;
  min-height:48px;
  transition:background .3s var(--ease),border-color .3s var(--ease);
}
.btn:hover{background:var(--brass-hi);border-color:var(--brass-hi)}
.result{
  margin-top:26px;
  padding:20px 22px;
  background:var(--card);
  border:1px solid var(--line-soft);
  border-radius:2px;
}
.result .label{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.12em;
  color:var(--muted);
  margin-bottom:6px;
}
.result .value{
  font-size:19px;
  font-weight:400;
  font-family:var(--mono);
  color:var(--brass-hi);
  word-break:break-all;
  letter-spacing:.02em;
}
.result .coord{display:flex;gap:24px;margin-top:18px}
.result .coord > div{flex:1;min-width:0}
#map{
  width:100%;
  height:300px;
  border-radius:2px;
  margin-top:18px;
  border:1px solid var(--line-soft);
  overflow:hidden;
  background:#0B0F10;
}
#map iframe{width:100%;height:100%;border:0;display:block}
.error{
  color:var(--wall);
  font-size:12.5px;
  font-family:var(--mono);
  letter-spacing:.03em;
  margin-top:14px;
}
@media (max-width:420px){
  .container{padding:40px 18px 52px}
  h1{font-size:20px}
  #map{height:240px}
}
</style>
</head>
<body>
    <div class="container">
        <span class="mark">TECY · GPS 小工具</span>
        <h1>解密 · 定位</h1>
        <span class="tagline">粘贴 base64 密文，解出坐标并在地图上标点</span>
        <textarea id="input" placeholder="粘贴 Base64 密文"></textarea>
        <button class="btn" onclick="decrypt()">解密并定位</button>
        <div id="error"></div>
        <div id="result" style="display:none;"></div>
        <div id="map" style="display:none;"></div>
    </div>

    <script>
    function decrypt() {
        var input = document.getElementById('input').value.trim();
        var errEl = document.getElementById('error');
        var resEl = document.getElementById('result');
        var mapEl = document.getElementById('map');
        errEl.textContent = '';
        resEl.style.display = 'none';
        mapEl.style.display = 'none';

        if (!input) {
            errEl.textContent = '请先粘贴密文';
            return;
        }

        var raw;
        try {
            raw = decodeURIComponent(escape(atob(input)));
        } catch(e) {
            errEl.textContent = '解码失败，请检查密文是否正确';
            return;
        }

        var parts = raw.split(',');
        if (parts.length < 2) {
            errEl.textContent = '格式不正确，解码结果: ' + raw;
            return;
        }

        var lat = parseFloat(parts[0]);
        var lon = parseFloat(parts[1]);
        if (isNaN(lat) || isNaN(lon)) {
            errEl.textContent = '经纬度解析失败';
            return;
        }

        resEl.innerHTML =
            '<div class="label">解密结果</div>' +
            '<div class="value">' + raw + '</div>' +
            '<div class="coord">' +
                '<div><div class="label">纬度</div><div class="value" style="font-size:16px;">' + lat.toFixed(6) + '</div></div>' +
                '<div><div class="label">经度</div><div class="value" style="font-size:16px;">' + lon.toFixed(6) + '</div></div>' +
            '</div>';
        resEl.style.display = 'block';

        mapEl.innerHTML = '<iframe src="https://uri.amap.com/marker?position=' + lon + ',' + lat + '"></iframe>';
        mapEl.style.display = 'block';
    }

    document.getElementById('input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            decrypt();
        }
    });
    </script>
</body>
</html>
